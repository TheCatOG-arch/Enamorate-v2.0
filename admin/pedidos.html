<!-- admin/pedidos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos | Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fa-solid fa-mug-hot"></i> Enamorate</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="pedidos.html" class="active"><i class="fa-solid fa-receipt"></i> Pedidos</a>
            <a href="productos.html"><i class="fa-solid fa-box"></i> Productos</a>
            <a href="reclamos.html"><i class="fa-solid fa-triangle-exclamation"></i> Reclamos</a>
            <a href="reportes.html"><i class="fa-solid fa-file-excel"></i> Reportes</a>
        </nav>
        <div style="margin-top: auto; padding: 20px;">
            <button onclick="logout()" class="btn-logout" style="width: 100%;"><i class="fa-solid fa-power-off"></i> Salir</button>
        </div>
    </aside>
    
    <main class="main-content">
        <div class="top-header">
            <h1>Gestión de Pedidos</h1>
            <button class="btn-secondary" onclick="cargarPedidos()"><i class="fa-solid fa-rotate-right"></i> Actualizar</button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Total</th>
                        <th>Pago</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL PARA VER EL DETALLE DEL PEDIDO -->
    <div class="modal" id="modal-pedido">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detalle del Pedido</h2>
                <button type="button" class="close-modal" onclick="cerrarModalPedido()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="detalle-pedido-contenido" style="color: var(--text-main);">
                <!-- Aquí se cargará la tabla de productos -->
            </div>
            
            <!-- BOTONES DE ACCIÓN (Ubicación y Compartir) -->
            <div id="acciones-ubicacion" style="display: none; margin-top: 20px; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button onclick="abrirMapa()" class="btn-primary" style="background: #10b981; color: white; flex: 1;">
                    <i class="fa-solid fa-map-location-dot"></i> Ver Ubicación en Maps
                </button>
                <button onclick="compartirUbicacion()" class="btn-secondary" style="flex: 1; border-color: #10b981; color: #10b981;">
                    <i class="fa-solid fa-share-nodes"></i> Compartir Ubicación
                </button>
            </div>

            <button class="btn-primary" onclick="cerrarModalPedido()" style="width: 100%; margin-top: 20px; background: var(--surface); color: var(--text-main); border: 1px solid var(--border);">Cerrar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkSession();
        let coordenadasActuales = null;

        async function cargarPedidos() {
            const { data } = await supabaseClient.from('pedidos').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tabla-pedidos');
            tbody.innerHTML = '';
            if(!data) return;

            data.forEach(p => {
                let badgeClass = p.estado === 'pagado' ? 'badge-success' : p.estado === 'pendiente' ? 'badge-warning' : 'badge-danger';
                
                tbody.innerHTML += `
                    <tr>
                        <td>#${p.id.substring(0,6)}</td>
                        <td>${p.cliente_nombre}<br><small>${p.cliente_telefono}</small></td>
                        <td>S/ ${Number(p.total).toFixed(2)}</td>
                        <td>${p.metodo_pago.toUpperCase()}</td>
                        <td><span class="badge ${badgeClass}">${p.estado.toUpperCase()}</span></td>
                        <td>${new Date(p.created_at).toLocaleDateString()}</td>
                        <td style="display: flex; gap: 5px;">
                            <button class="btn-secondary" style="padding:5px 10px; font-size: 0.8rem;" onclick="verOrden('${p.id}')">
                                <i class="fa-solid fa-eye"></i> Ver Orden
                            </button>
                            ${p.estado === 'pendiente' ? `<button class="btn-primary" style="padding:5px 10px; font-size: 0.8rem;" onclick="cambiarEstado('${p.id}', 'pagado')">Aprobar</button>` : ''}
                        </td>
                    </tr>
                `;
            });
        }

        // FUNCIÓN PARA VER LA ORDEN
        async function verOrden(id) {
            // 1. Buscar cabecera para obtener dirección
            const { data: pedidoData } = await supabaseClient
                .from('pedidos')
                .select('direccion')
                .eq('id', id)
                .single();

            // 2. Buscar items del pedido
            const { data, error } = await supabaseClient
                .from('pedido_items')
                .select('*, productos(nombre)')
                .eq('pedido_id', id);

            if (error) {
                console.error("Error al cargar los items:", error);
                document.getElementById('detalle-pedido-contenido').innerHTML = '<p style="text-align:center; color: red;">Error de conexión al cargar los productos.</p>';
                document.getElementById('modal-pedido').classList.add('open');
                return;
            }

            let html = '<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">';
            html += '<thead><tr style="border-bottom: 2px solid var(--border);"><th style="padding: 10px; text-align: left;">Cant.</th><th style="padding: 10px; text-align: left;">Producto</th><th style="padding: 10px; text-align: left;">Detalles / Notas</th><th style="padding: 10px; text-align: right;">Subtotal</th></tr></thead><tbody>';
            
            if (data.length === 0) {
                html += '<tr><td colspan="4" style="text-align:center; padding: 20px; color: var(--text-muted);"><i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>No se encontraron productos registrados para este pedido.</td></tr>';
            } else {
                data.forEach(item => {
                    const nombreProd = item.productos ? item.productos.nombre : 'Producto Eliminado';
                    html += `<tr style="border-bottom: 1px solid var(--border);">
                        <td style="padding: 10px;">${item.cantidad}x</td>
                        <td style="padding: 10px; font-weight: 600;">${nombreProd}</td>
                        <td style="padding: 10px; font-size: 0.85rem; color: var(--text-muted);">${item.extras || 'Sin extras'}</td>
                        <td style="padding: 10px; text-align: right;">S/ ${Number(item.subtotal).toFixed(2)}</td>
                    </tr>`;
                });
            }
            html += '</tbody></table>';
            
            document.getElementById('detalle-pedido-contenido').innerHTML = html;

            // Lógica para los botones de GPS
            const accionesDiv = document.getElementById('acciones-ubicacion');
            if (pedidoData && pedidoData.direccion && pedidoData.direccion.startsWith("GPS: ")) {
                coordenadasActuales = pedidoData.direccion.replace("GPS: ", "");
                accionesDiv.style.display = 'flex';
            } else {
                coordenadasActuales = null;
                accionesDiv.style.display = 'none';
            }

            document.getElementById('modal-pedido').classList.add('open');
        }

        function cerrarModalPedido() {
            document.getElementById('modal-pedido').classList.remove('open');
        }

        // Abrir Google Maps en una nueva pestaña
        function abrirMapa() {
            if (coordenadasActuales) {
                window.open(`https://www.google.com/maps/search/?api=1&query=${coordenadasActuales}`, '_blank');
            }
        }

        // Compartir link de Google Maps
        function compartirUbicacion() {
            if (coordenadasActuales) {
                const url = `https://www.google.com/maps/search/?api=1&query=${coordenadasActuales}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'Ubicación del Pedido',
                        text: 'Aquí está la ubicación exacta para el delivery:',
                        url: url
                    }).catch(console.error);
                } else {
                    navigator.clipboard.writeText(url);
                    alert("¡Enlace de Google Maps copiado al portapapeles!");
                }
            }
        }

        async function cambiarEstado(id, nuevoEstado) {
            await supabaseClient.from('pedidos').update({ estado: nuevoEstado }).eq('id', id);
            cargarPedidos();
        }

        window.onload = cargarPedidos;
    </script>
</body>
</html>
